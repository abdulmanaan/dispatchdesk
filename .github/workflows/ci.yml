name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch or PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres and Redis, same as local development: the concurrency
    # tests rely on actual row locks, so SQLite or mocks would prove nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatchdesk
          POSTGRES_PASSWORD: dispatchdesk
          POSTGRES_DB: dispatchdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatchdesk -d dispatchdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://dispatchdesk:dispatchdesk@localhost:5432/dispatchdesk_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Includes migrations (applied from scratch), the model/migration drift
      # check and the row-locking concurrency tests.
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
