# Local development stack: PostgreSQL, Redis, the FastAPI backend, the jobs worker
# and the Vite dev server for the frontend.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatchdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatchdesk}
      POSTGRES_DB: ${POSTGRES_DB:-dispatchdesk}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatchdesk} -d ${POSTGRES_DB:-dispatchdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dispatchdesk}:${POSTGRES_PASSWORD:-dispatchdesk}@postgres:5432/${POSTGRES_DB:-dispatchdesk}
      REDIS_URL: redis://redis:6379/0
      # Local dev runs as the demo: one-click logins, simulated background drivers,
      # and no location-age check (seeded drivers never move).
      DEMO_MODE: ${DEMO_MODE:-true}
      DISPATCH_LOCATION_MAX_AGE_MINUTES: ${DISPATCH_LOCATION_MAX_AGE_MINUTES:-0}
    # Apply migrations, then start the API with auto-reload on code changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the background jobs (reassign unaccepted orders, retry pending dispatch,
  # flag overdue deliveries) every JOBS_INTERVAL_SECONDS.
  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dispatchdesk}:${POSTGRES_PASSWORD:-dispatchdesk}@postgres:5432/${POSTGRES_DB:-dispatchdesk}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      DISPATCH_LOCATION_MAX_AGE_MINUTES: ${DISPATCH_LOCATION_MAX_AGE_MINUTES:-0}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-30}
      ACCEPTANCE_TIMEOUT_SECONDS: ${ACCEPTANCE_TIMEOUT_SECONDS:-180}
    command: python -m app.jobs.worker
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      # The backend applies migrations on start.
      backend:
        condition: service_started

  frontend:
    image: node:24-alpine
    working_dir: /app
    # node_modules lives in a named volume so the host's (macOS) build is never used inside Linux.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
